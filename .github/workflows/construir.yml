# Construye y publica la experiencia RA.
# Se ejecuta en cada cambio del repositorio (por ejemplo, cuando el panel publica imágenes nuevas):
# 1) reconstruye experiencia.glb y experiencia.usdz con las imágenes de config.json
# 2) publica todo el sitio en GitHub Pages. Tarda de 2 a 4 minutos.
# Requisito: Settings -> Pages -> Source: "GitHub Actions".
name: Construir y publicar valla RA

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write                # guardar en el repositorio los archivos generados (respaldo)
  pages: write                   # publicar en GitHub Pages
  id-token: write

concurrency:
  group: publicar-valla
  cancel-in-progress: true       # si se publica dos veces seguidas, gana la última

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Instalar librerías
        run: pip install -r herramientas/requirements.txt

      - name: Construir la experiencia
        run: python herramientas/construir.py .

      - name: Guardar respaldo de los archivos generados
        run: |
          git config user.name  "Construccion automatica RA"
          git config user.email "actions@users.noreply.github.com"
          git add experiencia.glb experiencia.usdz version.json
          git commit -m "Valla actualizada automáticamente [skip ci]" || echo "Sin cambios"
          git pull --rebase origin main || true
          git push || echo "No se pudo guardar el respaldo (la publicación continúa)"

      - name: Preparar el sitio
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
